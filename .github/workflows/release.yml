# Builds and publishes a release when a version tag is pushed.
#
#     git tag v0.9.1
#     git push origin v0.9.1
#
# The version in the tag is written into the assembly, so the number the app reports and the
# number people downloaded always agree — which matters here because the update check compares
# exactly those two.
#
# The project file and the executable are named differently and both names matter. The project is
# still CouchSession.csproj from an earlier name; the assembly it produces is CouchSession.exe, set
# by <AssemblyName> in that file. This referenced CouchModeGaming for both, which is two renames
# out of date and would have failed on the first tag push.

name: Release

on:
  push:
    tags: ['v*']

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "number=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "number=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: >
          dotnet publish CouchSession.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.number }}
          -o publish

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: CouchSession
          path: publish/CouchSession.exe

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/CouchSession.exe
          generate_release_notes: true
