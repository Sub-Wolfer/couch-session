<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Couch Mode — text editor</title>
<style>
/* Rough copy of the settings window. Function over polish, as asked. */
:root{
  --window:#12141a; --rail:#171a21; --surface:#1e222b; --surface-hi:#2a303c;
  --line:#3a4252; --hairline:#2d333f; --input:#303745; --input-line:#4e586c;
  --text:#e9ecf2; --dim:#acb5c5; --faint:#7e8798;
  --accent:#7c6af7; --accent-hi:#8e7eff; --good:#3ebf7a; --bad:#ee6060;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--window); color:var(--text);
  font:14px/1.5 "Segoe UI",system-ui,sans-serif; height:100vh; display:flex; flex-direction:column;
}
#bar{
  display:flex; align-items:center; gap:10px; padding:9px 14px;
  background:#101218; border-bottom:1px solid var(--hairline); flex:none;
}
#bar b{font-size:13px; font-weight:600; color:var(--dim); margin-right:8px}
button{
  font:inherit; font-size:13px; padding:7px 14px; border-radius:8px; cursor:pointer;
  background:var(--surface-hi); color:var(--text); border:1px solid var(--line);
}
button:hover{background:#333b49}
button.go{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
button.go:hover{background:var(--accent-hi)}
button:disabled{opacity:.4; cursor:default}
#status{margin-left:auto; font-size:12.5px; color:var(--faint)}
#status.ok{color:var(--good)}

#main{flex:1; display:flex; min-height:0}
#rail{
  width:230px; flex:none; background:var(--rail); border-right:1px solid var(--hairline);
  overflow:auto; padding:10px 0;
}
#rail a{
  display:block; margin:2px 10px; padding:8px 13px; border-radius:8px;
  color:var(--dim); font-size:13.5px; cursor:pointer; user-select:none;
}
#rail a:hover{background:var(--surface)}
#rail a.on{background:#3a3468; color:#fff; font-weight:600}
#rail a .n{float:right; color:var(--faint); font-size:11.5px; font-weight:400}

#page{flex:1; overflow:auto; padding:24px 30px 60px}
h2{margin:0 0 3px; font-size:21px; letter-spacing:-.02em}
.sub{color:var(--faint); font-size:13px; margin-bottom:20px}
.card{
  background:var(--surface); border:1px solid var(--hairline);
  border-radius:11px; margin-bottom:14px;
}
.row{padding:14px 16px}
.row+.row{border-top:1px solid var(--hairline)}
.key{
  font-size:10.5px; letter-spacing:.07em; color:var(--faint);
  font-family:Consolas,monospace; margin-bottom:7px;
}
.key em{font-style:normal; color:var(--accent-hi)}
label{display:block; font-size:11px; color:var(--faint); margin:8px 0 3px}
textarea,input[type=text]{
  width:100%; font:inherit; font-size:13.5px; color:var(--text);
  background:var(--input); border:1px solid var(--input-line); border-radius:7px;
  padding:8px 10px; resize:vertical;
}
textarea:focus,input:focus{outline:none; border-color:var(--accent)}
textarea.desc{font-size:12.8px; color:var(--dim); min-height:52px}
.changed textarea,.changed input{border-color:var(--good)}
.list textarea{min-height:auto; height:34px}
#empty{padding:60px 30px; color:var(--faint); text-align:center; line-height:1.9}
#empty b{color:var(--text); display:block; font-size:16px; margin-bottom:8px}
kbd{
  background:var(--input); border:1px solid var(--input-line); border-radius:5px;
  padding:1px 6px; font-family:Consolas,monospace; font-size:12px;
}
</style>
</head>
<body>

<div id="bar">
  <b>Couch Mode text</b>
  <button id="open">Open Words.cs…</button>
  <button id="save" class="go" disabled>Save Words.cs</button>
  <button id="revert" disabled>Undo all</button>
  <span id="status">No file loaded</span>
  <input type="file" id="file" accept=".cs" hidden>
</div>

<div id="main">
  <div id="rail"></div>
  <div id="page">
    <div id="empty">
      <b>Open your Words.cs to start</b>
      Press <kbd>Open Words.cs…</kbd> and pick<br>
      <kbd>TvMode\Ui\Words.cs</kbd><br><br>
      Edit the text, press Save, and let it overwrite the same file.<br>
      Then rebuild the app as usual.
    </div>
  </div>
</div>

<script>
// ── state ────────────────────────────────────────────────────────────────
let source = "";        // the file exactly as loaded
let items  = [];        // {name, kind, value|values, start, end, group}
let groups = [];        // section headings, in file order
let active = 0;
let dirty  = false;

const $ = s => document.querySelector(s);

// ── parsing ──────────────────────────────────────────────────────────────
// Offsets of each value expression are kept so saving splices new text into the
// original file. That way every comment and the whole layout survive untouched.
function parse(text){
  source = text; items = []; groups = [];

  const heading = /^\s*\/\/ ── (.+?) ─+\s*$/gm;
  let m, marks = [];
  while ((m = heading.exec(text))) marks.push({name:m[1].trim(), at:m.index});
  groups = marks.map(x => x.name);
  const groupAt = pos => {
    let g = 0;
    for (let i = 0; i < marks.length; i++) if (marks[i].at < pos) g = i;
    return g;
  };

  // single or concatenated strings
  const one = /public const string (\w+)\s*=\s*((?:"(?:[^"\\]|\\.)*"\s*(?:\+\s*)?)+);/g;
  while ((m = one.exec(text))){
    items.push({
      name:m[1], kind:"string", value:joinLiterals(m[2]),
      start:m.index + m[0].indexOf(m[2]), end:m.index + m[0].length - 1,
      group:groupAt(m.index)
    });
  }

  // string arrays
  const arr = /public static readonly string\[\] (\w+)\s*=\s*\[([\s\S]*?)\];/g;
  while ((m = arr.exec(text))){
    const body = m[2];
    const vals = [...body.matchAll(/"(?:[^"\\]|\\.)*"/g)].map(x => unescape_(x[0]));
    // The opening bracket is found after the "=", never by searching from the start —
    // "string[]" in the declaration contains a bracket of its own and would match first,
    // which would splice the replacement over the type name and destroy the file.
    const open = m[0].indexOf("[", m[0].indexOf("="));

    items.push({
      name:m[1], kind:"array", values:vals,
      start:m.index + open,
      end:m.index + m[0].length - 1,
      group:groupAt(m.index)
    });
  }

  items.sort((a,b) => a.start - b.start);
}

const joinLiterals = expr =>
  [...expr.matchAll(/"(?:[^"\\]|\\.)*"/g)].map(x => unescape_(x[0])).join("");

const unescape_ = lit =>
  lit.slice(1,-1).replace(/\\n/g,"\n").replace(/\\t/g,"\t")
     .replace(/\\"/g,'"').replace(/\\\\/g,"\\");

const escape_ = s =>
  '"' + s.replace(/\\/g,"\\\\").replace(/"/g,'\\"')
         .replace(/\n/g,"\\n").replace(/\t/g,"\\t") + '"';

// long text goes back as wrapped concatenation, matching the file's own style
function emit(value, indent){
  const lit = escape_(value);
  if (lit.length <= 96) return lit;

  const words = value.split(" ");
  const lines = []; let cur = "";
  for (const w of words){
    if (cur && (cur + " " + w).length > 78){ lines.push(cur + " "); cur = ""; }
    cur = cur ? cur + " " + w : w;
  }
  if (cur) lines.push(cur);
  const pad = " ".repeat(indent);
  return "\n" + pad + lines.map(escape_).join("\n" + pad + "+ ");
}

// ── rendering ────────────────────────────────────────────────────────────
function pairKey(name){ return name.endsWith("Why") ? name.slice(0,-3) : name; }

function render(){
  const rail = $("#rail"); rail.innerHTML = "";

  groups.forEach((g,i) => {
    const n = items.filter(x => x.group === i).length;
    if (!n) return;
    const a = document.createElement("a");
    a.className = i === active ? "on" : "";
    a.innerHTML = g + '<span class="n">' + n + "</span>";
    a.onclick = () => { active = i; render(); };
    rail.appendChild(a);
  });

  const page = $("#page");
  page.innerHTML = "<h2>" + groups[active] + "</h2>" +
    '<div class="sub">Edit the text. Names on the left are what the code uses — leave those alone.</div>';

  const mine = items.filter(x => x.group === active);
  const done = new Set();
  let card = null;

  const newCard = () => { card = document.createElement("div"); card.className = "card"; page.appendChild(card); };
  newCard();

  for (const it of mine){
    if (done.has(it.name)) continue;

    const row = document.createElement("div");
    row.className = "row";

    // pair "X" with "XWhy" into one row, like a settings toggle
    const why = it.name.endsWith("Why") ? null
              : mine.find(o => o.name === it.name + "Why");

    row.innerHTML = '<div class="key"><em>' + it.name + '</em>' +
                    (why ? " + " + why.name : "") + "</div>";

    if (it.kind === "array"){
      row.classList.add("list");
      it.values.forEach((v,i) => {
        row.appendChild(field("Option " + (i+1), v, t => { it.values[i] = t; touch(row); }, false));
      });
    } else {
      row.appendChild(field(why ? "Heading" : null, it.value,
                            t => { it.value = t; touch(row); }, false));
      if (why){
        row.appendChild(field("Description", why.value,
                              t => { why.value = t; touch(row); }, true));
        done.add(why.name);
      }
    }

    done.add(it.name);
    card.appendChild(row);
    if (card.children.length >= 8) newCard();
  }
}

function field(label, value, onChange, isDesc){
  const wrap = document.createDocumentFragment();
  if (label){ const l = document.createElement("label"); l.textContent = label; wrap.appendChild(l); }

  const ta = document.createElement("textarea");
  ta.value = value;
  ta.rows = isDesc ? 3 : Math.max(1, Math.ceil(value.length / 90));
  if (isDesc) ta.className = "desc";
  ta.oninput = () => onChange(ta.value);
  wrap.appendChild(ta);
  return wrap;
}

function touch(row){
  row.classList.add("changed");
  dirty = true;
  $("#revert").disabled = false;
  setStatus(items.length + " strings · unsaved changes", false);
}

function setStatus(t, ok){ const s = $("#status"); s.textContent = t; s.className = ok ? "ok" : ""; }

// ── save ─────────────────────────────────────────────────────────────────
// Rebuilt back-to-front so earlier offsets stay valid as text is spliced in.
function build(){
  let out = source;

  [...items].sort((a,b) => b.start - a.start).forEach(it => {
    const before = out.slice(0, it.start);
    const lineStart = before.lastIndexOf("\n") + 1;
    const indent = (before.slice(lineStart).match(/^\s*/) || [""])[0].length + 4;

    const replacement = it.kind === "array"
      ? "[\n" + it.values.map(v => "        " + escape_(v) + ",").join("\n") + "\n    ]"
      : emit(it.value, indent);

    out = before + replacement + out.slice(it.end);
  });

  return out;
}

// ── wiring ───────────────────────────────────────────────────────────────
$("#open").onclick = () => $("#file").click();

$("#file").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;

  const r = new FileReader();
  r.onload = () => {
    parse(r.result);
    if (!items.length){ setStatus("Nothing recognisable in that file", false); return; }
    active = 0; dirty = false;
    $("#save").disabled = false;
    render();
    setStatus(items.length + " strings loaded", true);
  };
  r.readAsText(f, "utf-8");
};

$("#save").onclick = () => {
  const blob = new Blob([build()], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Words.cs";
  a.click();
  URL.revokeObjectURL(a.href);
  dirty = false;
  setStatus("Saved — now rebuild the app", true);
};

$("#revert").onclick = () => {
  if (dirty && !confirm("Throw away every change since the file was opened?")) return;
  parse(source); render(); dirty = false;
  $("#revert").disabled = true;
  setStatus(items.length + " strings loaded", true);
};

addEventListener("beforeunload", e => { if (dirty) e.preventDefault(); });
</script>
</body>
</html>
